[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    tier1: Tier 1 Feature Coverage tests (isolated happy-path tests)
    tier2: Tier 2 Boundary & Corner Cases (stress, edge, and error condition tests)
    tier3: Tier 3 Cross-Feature Pairwise Combinations (multi-module interactions)
    tier4: Tier 4 Real-World Scenarios (complete end-to-end workflows)
    e2e: End-to-end integration tests
